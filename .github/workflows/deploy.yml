name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e

            APP=/root/daysWorkfix
            cd "$APP"

            echo "===== Pulling latest code ====="
            git fetch --all
            git reset --hard origin/main

            echo "===== Server: install deps ====="
            cd "$APP/server"
            npm ci --omit=dev

            echo "===== Client: install + build ====="
            cd "$APP/client"
            npm ci
            npm run build

            echo "===== Migrations (idempotent) ====="
            cd "$APP/server"
            node fixIndexes.js || echo "fixIndexes skipped"
            node seedKnowledge.js || echo "seedKnowledge skipped"

            echo "===== Reload pm2 ====="
            pm2 reload daysworkfix-server --update-env
            pm2 save

            echo "===== Health checks ====="
            sleep 3
            curl -fsS http://localhost:5000/ >/dev/null && echo "API: OK"
            curl -fsS http://localhost:11434/api/tags >/dev/null && echo "Ollama: OK"

            echo "===== Done ====="

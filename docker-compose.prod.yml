services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks: [app]

  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_started
    environment:
      - NODE_ENV=production
      - PORT=5001
      - MONGODB_URI=mongodb://mongo:27017/daily_work_log
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-30d}
      # Базовый публичный URL для ссылок клиентского портала в уведомлениях
      - APP_PUBLIC_URL=${APP_PUBLIC_URL:-}
    volumes:
      - api-uploads:/app/uploads
    networks: [app]

  web:
    build:
      context: ./client
      args:
        # Клиент будет ходить в /api → Caddy проксирует в api:5001
        VITE_API_URL: "/"
    restart: unless-stopped
    networks: [app]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-:80}
      - ACME_EMAIL=${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - web
    networks: [app]

volumes:
  mongo-data:
  api-uploads:
  caddy-data:
  caddy-config:

networks:
  app:
    driver: bridge
